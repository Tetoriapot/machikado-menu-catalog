<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#214e40"/>
    <meta name="description" content="現代・平成・昭和・ヴィクトリア朝イギリス・1920年代アメリカの架空店舗を探す、創作とTRPGのためのメニューカタログ。検索・価格・PL表示・コピーに対応。"/>
    <title>まちかどメニュー帖｜架空店舗メニューカタログ</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
    <script id="theme-init">
      // Apply before the stylesheet and React load to avoid a bright first frame.
      (() => {
        let saved;
        try { saved = localStorage.getItem('machikado.theme.v1'); } catch {}
        const dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#19231f');
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
